map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Only the local Tunnel connector should reach the published origin port.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
}
map $forwarded_proto $forwarded_port {
    https 443;
    default $server_port;
}
map $http_x_real_ip $real_client_ip {
    default $http_x_real_ip;
    '' $remote_addr;
}
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    '' $real_client_ip;
}
map $request_uri $cache_control {
    default no-cache;
    ~^/api/ no-store;
    /healthz no-store;
}

# Omit query strings, cookies and request bodies from access logs.
log_format palmdesk '$client_ip [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log palmdesk;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control $cache_control always;

    # Re-resolve after backend container replacement without restarting Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:4300;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header Connection "";

    location = /healthz {
        access_log off;
        proxy_pass $backend/healthz;
    }

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_buffering off;
    }

    location ^~ /socket.io/ {
        proxy_pass $backend;
        # proxy_set_header inheritance is all-or-nothing at each level.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
