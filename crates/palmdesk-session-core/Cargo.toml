[package]
name = "palmdesk-session-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14.2", default-features = false, features = ["napi4", "async", "serde-json"] }
napi-derive = "3.6.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"

[build-dependencies]
napi-build = "2.6.0"
